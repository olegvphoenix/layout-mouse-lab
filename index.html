}
function cursorHint(edge,node){
  if(edge.length===2)return 'Угол выбранной ячейки. Тяните по диагонали для поглощения. Тяните внутрь для возврата.';
  if(edge)return 'Граница выбранной ячейки. Тяните к соседней линии сетки.';
  return 'Центр '+address(node)+' · '+nameOf(node)+'. Нажмите для выбора или перетащите содержимое.';
}
wall.addEventListener('click',e=>{
  const clear=e.target.closest('.clear-camera');
  if(!clear||drag)return;
  if(e.detail && !clear.contains(document.elementFromPoint(e.clientX,e.clientY)))return;
  wall.toggleAttribute('data-pointer-focus',e.detail>0);
  wall.focus({preventScroll:true});
  clearCameras([Number(clear.closest('.tile').dataset.key)]);
});
wall.addEventListener('pointerdown',e=>{
  if(e.target.closest('.clear-camera'))return;
  if(e.button!==0||drag)return;
  if(stripPick){stripPick=null;drawStripPick()}
  highlightEdge('');
  e.preventDefault();
  wall.dataset.pointerFocus="";wall.focus({preventScroll:true});
  const p=point(e),target=hit(p),edge=edgeAt(p);
  if((e.ctrlKey||e.metaKey)){clearInsertionPreview();togglePicked(target.key);return}
  if(e.shiftKey){clearInsertionPreview();pickRange(target);return}
  const seam=dividerAt(e,edge);
  if(seam&&beginDivider(e,seam)){clearInsertionPreview();paintDivider(drag.group,model);return}
  const strip=!edge?innerStrip(p):null;
  if(strip){startStrip(e,strip.dir,strip.index);return}
  clearInsertionPreview();
  const source=edge?current():target;
  const members=model.selection?.includes(source.key)?model.nodes.filter(n=>model.selection.includes(n.key)):null;
  if(!members)choose(source.key);
  wall.setPointerCapture(e.pointerId);
  drag={kind:edge?'resize':'move',source,edge,start:p,clientX:e.clientX,clientY:e.clientY,id:e.pointerId,moved:false,members,next:null};
});
wall.addEventListener('pointermove',e=>{
  const p=point(e);
  if(!drag){

    if(e.target.closest('.clear-camera')){
      clearInsertionPreview();highlightEdge('');wall.style.cursor='default';return;
    }
    const edge=edgeAt(p),strip=!edge&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey?innerStrip(p):null;
    const seam=dividerAt(e,edge);
    if(seam){
      const group=seamComponent(model,visibleBoxes(model),seam.axis,seam.line,seam.at);
      if(group){clearInsertionPreview();highlightEdge(edge);paintDivider(group,model);wall.style.cursor=seam.axis==='x'?'col-resize':'row-resize';return}
    }
    if(strip){clearInsertionPreview();highlightEdge('');wall.style.cursor='copy';say(stripLabel(strip.dir,strip.index))}
    else{clearInsertionPreview();highlightEdge(edge);wall.style.cursor=cursorFor(edge);say(cursorHint(edge,hit(p)))}
    return;
  }
  if(e.pointerId!==drag.id)return;
  if(drag.kind==='divider'){previewDivider(e);return}
  if(Math.hypot(e.clientX-drag.clientX,e.clientY-drag.clientY)>=4)drag.moved=true;
  if(!drag.moved)return;
  if(drag.kind==='resize'){wall.style.cursor=cursorFor(drag.edge);resizePreview(p);return}
  carryCells(drag,e);
  if(drag.source.children||drag.members){wall.style.cursor='grabbing';previewGroupMove(p);return}
  const target=hit(p),source=drag.source;
  overlay.replaceChildren();
  if(target.key!==source.key&&p.x>=0&&p.y>=0&&p.x<model.width&&p.y<model.height)placePreview(target,'move-target');
  wall.style.cursor='grabbing';
  say(target.key===source.key?'Тяните в целевую ячейку.':nameOf(target)==='Пусто'?'Переместить '+nameOf(source)+' в '+address(target)+'.':'Обменять '+nameOf(source)+' ↔ '+nameOf(target)+'. Размеры позиций сохранятся.');
});
function cancelGesture(message){
  if(drag?.kind==='reorder'){
    const g=drag;drag=null;
    g.visual?.layer.remove();
    if(g.target.hasPointerCapture(g.id))g.target.releasePointerCapture(g.id);
    render();say(message);return;
  }
  stripPick=null;
  if(drag?.kind==='insert'){finishStrip(true);say(message);return}
  if(!drag&&model.selection)model={...model,selection:null};
  if(drag?.button?.hasPointerCapture(drag.id)){
    const b=drag.button,pointerId=drag.id;
    b.onpointercancel();
    if(b.hasPointerCapture(pointerId))b.releasePointerCapture(pointerId);
  }
  if(drag && wall.hasPointerCapture(drag.id))wall.releasePointerCapture(drag.id);
  leaveGesture();render();say(message);
}
wall.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  if(drag.kind==='divider'){
    previewDivider(e);
    const g=drag;drag=null;
    if(wall.hasPointerCapture(e.pointerId))wall.releasePointerCapture(e.pointerId);
    if(!g.moved&&g.onGrip)g.next=fixedDividerLayout(g,'es'.includes(g.edge)?1:-1,true);
    if(g.next&&g.moved)settleDivider(g,g.next);
    else{
      const next=g.next||fractionalResult(g);
      if(next)remember(next,'Пропорции соседних ячеек изменены.');else render();
    }
    overlay.replaceChildren();return;
  }
  const g=drag,p=point(e),outside=p.x<0||p.y<0||p.x>model.width||p.y>model.height;
  if(outside&&g.kind!=='resize'){cancelGesture('Действие отменено за пределами раскладки.');return}
  // Commit the resize already previewed, including the retained line inside the snap band.
  if(g.kind==='move'&&g.moved&&(g.source.children||g.members))previewGroupMove(p);
  g.visual?.layer.remove();
  drag=null;
  if(wall.hasPointerCapture(e.pointerId))wall.releasePointerCapture(e.pointerId);
  overlay.replaceChildren();
  if(g.kind==='resize'&&g.moved){
    const live=tiles.querySelector('.resize-live');
    const from=live?.getBoundingClientRect();
    if(g.next)remember(g.next,g.message);
    else{render();say('Исходные границы сохранены.')}
    if(from&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
      const tile=tiles.querySelector('.tile.selected'),to=tile.getBoundingClientRect();
      // Settle the picture while the handles are already available on the grid line.
      const transform='translate('+(from.x-to.x)+'px,'+(from.y-to.y)+'px) scale('+
        (from.width/to.width)+','+(from.height/to.height)+')';
      tile.querySelector('.frame').animate([
        {transformOrigin:'top left',transform},
        {transformOrigin:'top left',transform:'none'}
      ],{duration:120,easing:'ease-out'});
    }
    return;
  }
  if(g.kind==='move'&&g.moved&&(g.source.children||g.members)){
    if(g.next){remember(g.next,g.message);landCargo(g.visual.cargo,g.visual.w,g.visual.h,g.landing)}
    else{render();say('Область осталась на месте.')}
    return;
  }
  if(g.kind==='move'&&!g.moved&&g.members)choose(g.source.key);
  const target=hit(p);
  if(g.kind==='move'&&g.moved&&target.key!==g.source.key){
    if(!model.feeds[g.source.key]&&!model.feeds[target.key]){say('Обе ячейки пусты.');return}
    const next=structuredClone(model);swapPayload(next,g.source.key,target.key);next.active=target.key;
    remember(next,'Содержимое '+address(g.source)+' и '+address(target)+' поменялось местами.');
    landCargo(g.visual.cargo,g.visual.w,g.visual.h,target);return;
  }
  render();say(g.moved?'Геометрия сохранена без изменений.':'Выбрана '+address(g.source)+' · '+nameOf(g.source)+'. Тяните центр, границу или угол.');
});
wall.addEventListener('dragstart',e=>e.preventDefault());
wall.addEventListener('blur',()=>{delete wall.dataset.pointerFocus});
wall.addEventListener('keydown',e=>{
  delete wall.dataset.pointerFocus;
  if(e.key==='Delete'&&e.target===wall&&!drag&&!stripPick&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.shiftKey){
    e.preventDefault();clearCameras(model.selection||[model.active]);
  }
});
wall.addEventListener('pointerleave',()=>{if(!drag){clearInsertionPreview();highlightEdge('')}});
wall.addEventListener('pointercancel',()=>cancelGesture('Жест отменён.'));
wall.addEventListener('lostpointercapture',e=>{if(drag?.id===e.pointerId)cancelGesture('Жест отменён.')});
window.addEventListener('blur',()=>{if(drag)cancelGesture('Жест отменён.');else clearInsertionPreview()});
$('undo').onclick=()=>history(false);$('redo').onclick=()=>history(true);
$('reset').onclick=()=>{leaveGesture();remember(seed(),'Исходная сетка 8 × 8 восстановлена. Сброс можно отменить.')};
for(const button of document.querySelectorAll('.grid-presets button')){
  button.onclick=()=>{
    const size=Number(button.dataset.size);
    leaveGesture();
    remember(seed(size),'Создана тестовая сетка '+size+' × '+size+'.');
  };
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){cancelGesture('Предпросмотр снят. Включён указатель.');return}
  if((e.ctrlKey||e.metaKey)&&['KeyZ','KeyY'].includes(e.code)){e.preventDefault();history(e.code==='KeyY'||e.shiftKey)}
});
const sample=new URLSearchParams(location.search).get('sample');
if(sample==='proportions'){model=seed(2);model.active=2;}
if(sample==='3x3'||sample==='2x2'){
  const size=sample==='2x2'?2:3;
  model=reshape(rect(0,0,size,size),current());
  document.title='Раскладка · '+size+'×'+size;
}
if(sample==='shrink-edge'){
  model=reshape(rect(0,0,2,2),current());
  model.active=16;
  model=gridWithBounds(rect(-3,-1,11,9));
  const n=current();
  model=reshape(rect(0,n.y,n.w+3,n.h),n);
}
if(sample==='trim-left'||sample==='trim-edges'){
  model=reshape(rect(0,0,2,2),current());
  model=gridWithBounds(sample==='trim-left'?rect(-2,0,10,8):rect(-1,-1,10,10));
}
if(sample==='trim-16'){
  const size=16;
  model=gridWithBounds(rect(0,0,size,size));
  for(const n of model.nodes){
    model.feeds[n.key]=n.x>0&&n.y>0&&n.x<size-1&&n.y<size-1?feedAt(n.key):null;
  }
  model.active=size+1;
}
if(sample==='alley-grow'){
  model.active=3;
  model=gridWithBounds(rect(2,0,3,3));
  model=gridWithBounds(rect(0,-2,3,5));
  const cell=current();
  model=reshape(rect(cell.x,0,1,3),cell);
}
if(sample==='inner-strips'){
  model=reshape(rect(0,0,2,2),current());
  for(const dir of ['x','y']){
    model=editStrips(dir,3);
    model=editStrips(dir,4);
  }
}
render();say(defaultHint);
</script>
</html>
